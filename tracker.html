<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Software & Technology Foundation — Learning Tracker</title>
<style>
  :root{
    --bg:#0f1117;
    --panel:#161923;
    --panel-2:#1c202c;
    --border:#2a2f3d;
    --text:#e6e8ee;
    --text-dim:#9aa0ae;
    --accent:#5b8def;

    --grey-bg:#3a3f4b;
    --grey-fg:#c6cad3;
    --grey-dot:#8b93a3;

    --blue-bg:#1c3a5e;
    --blue-fg:#8fc0ff;
    --blue-dot:#4a9eff;

    --green-bg:#173d2b;
    --green-fg:#7ee2a8;
    --green-dot:#36c76c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
  }
  header.page{
    padding:32px 40px 20px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:linear-gradient(180deg, var(--bg) 85%, transparent);
    z-index:20;
  }
  header.page h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header.page p{
    margin:0;
    color:var(--text-dim);
    font-size:14px;
  }

  .progress-wrap{
    max-width:1100px;
    margin:18px auto 0;
    padding:0 40px;
  }
  .progress-summary{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:8px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:90px;
  }
  .stat .num{font-size:22px;font-weight:700;}
  .stat .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
  .stat.not-started .num{color:var(--grey-fg);}
  .stat.in-progress .num{color:var(--blue-fg);}
  .stat.done .num{color:var(--green-fg);}

  .bar-outer{
    flex:1 1 260px;
    height:10px;
    border-radius:6px;
    background:var(--panel-2);
    overflow:hidden;
    display:flex;
    min-width:200px;
  }
  .bar-seg{height:100%;}
  .bar-seg.done{background:var(--green-dot);}
  .bar-seg.progress{background:var(--blue-dot);}

  main{
    max-width:1100px;
    margin:0 auto;
    padding:20px 40px 80px;
  }

  .toc{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .toc a{
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--panel);
    transition:.15s;
  }
  .toc a:hover{color:var(--text);border-color:var(--accent);}

  section.category{
    margin-bottom:36px;
  }
  section.category > h2{
    font-size:20px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:2px solid var(--border);
    margin:0 0 18px;
    scroll-margin-top:110px;
  }

  .subsection{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:16px;
    overflow:hidden;
    scroll-margin-top:110px;
  }
  .subsection > .sub-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    cursor:pointer;
    user-select:none;
  }
  .subsection > .sub-header:hover{background:var(--panel-2);}
  .subsection > .sub-header h3{
    margin:0;
    font-size:15px;
    font-weight:600;
  }
  .sub-meta{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:var(--text-dim);
  }
  .mini-bar{
    width:70px;
    height:6px;
    border-radius:4px;
    background:var(--panel-2);
    overflow:hidden;
    display:flex;
  }
  .chevron{
    transition:transform .2s;
    color:var(--text-dim);
    font-size:12px;
  }
  .subsection.collapsed .chevron{transform:rotate(-90deg);}
  .subsection.collapsed table{display:none;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-dim);
    padding:8px 18px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:var(--panel-2);
  }
  tbody td{
    padding:10px 18px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  td.ticket{
    color:var(--accent);
    font-weight:600;
    font-size:13px;
    white-space:nowrap;
  }
  td.summary{color:var(--text);}
  td.status{width:170px;}

  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 10px 5px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    border:none;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-repeat:no-repeat;
    background-position:right 8px center;
    width:100%;
  }
  .status-badge.not-started{background:var(--grey-bg);color:var(--grey-fg);}
  .status-badge.in-progress{background:var(--blue-bg);color:var(--blue-fg);}
  .status-badge.done{background:var(--green-bg);color:var(--green-fg);}

  .dot{
    width:8px;height:8px;border-radius:50%;flex:none;
  }
  .not-started .dot{background:var(--grey-dot);}
  .in-progress .dot{background:var(--blue-dot);}
  .done .dot{background:var(--green-dot);}

  select.status-select{
    font-family:inherit;
  }
  select.status-select option{
    background:var(--panel);
    color:var(--text);
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:20px;
  }

  @media (max-width:700px){
    header.page, main, .progress-wrap{padding-left:16px;padding-right:16px;}
    td.status{width:130px;}
  }
</style>
</head>
<body>

<header class="page">
  <h1>📚 Software &amp; Technology Foundation</h1>
  <p>Learning roadmap tracker — click any status badge to update progress. Changes are saved in this browser.</p>
</header>

<div class="progress-wrap">
  <div class="progress-summary" id="summary">
    <div class="stat not-started"><span class="num" id="count-not-started">0</span><span class="lbl">Not Started</span></div>
    <div class="stat in-progress"><span class="num" id="count-in-progress">0</span><span class="lbl">In Progress</span></div>
    <div class="stat done"><span class="num" id="count-done">0</span><span class="lbl">Done</span></div>
    <div class="bar-outer" id="overall-bar"></div>
    <div class="stat"><span class="num" id="count-pct">0%</span><span class="lbl">Complete</span></div>
  </div>
</div>

<main>
  <nav class="toc" id="toc"></nav>
  <div id="content"></div>
</main>

<footer>178 topics · Generated learning tracker · Status stored locally per-browser</footer>

const STATUS = {
  "not-started": { label: "Not Started" },
  "in-progress": { label: "In Progress" },
  "done": { label: "Done" },
};
const STORAGE_KEY = "learn-tracker-status-v1";

function loadState(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

function slug(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function statusBadgeHTML(id, current){
  const opts = Object.entries(STATUS).map(([key,v]) =>
    `<option value="${key}" ${key===current?'selected':''}>${v.label}</option>`
  ).join('');
  return `
    <span class="status-badge ${current}">
      <span class="dot"></span>
      <select class="status-select" data-id="${id}" aria-label="Status for ${id}"
        style="background:transparent;border:none;color:inherit;font-weight:600;font-size:12px;flex:1;cursor:pointer;">
        ${opts}
      </select>
    </span>`;
}

function buildContent(){
  const root = document.getElementById('content');
  const toc = document.getElementById('toc');
  root.innerHTML = '';
  toc.innerHTML = '';

  DATA.forEach((cat, ci) => {
    const catId = `cat-${ci}`;
    const section = document.createElement('section');
    section.className = 'category';
    section.id = catId;

    const h2 = document.createElement('h2');
    h2.innerHTML = `<span>${cat.icon}</span><span>${cat.title}</span>`;
    section.appendChild(h2);

    const tocLink = document.createElement('a');
    tocLink.href = `#${catId}`;
    tocLink.textContent = `${cat.icon} ${cat.title}`;
    toc.appendChild(tocLink);

    cat.subsections.forEach((sub, si) => {
      const subId = `${catId}-sub-${si}`;
      const box = document.createElement('div');
      box.className = 'subsection';
      box.id = subId;

      const header = document.createElement('div');
      header.className = 'sub-header';
      header.innerHTML = `
        <h3>${sub.title}</h3>
        <div class="sub-meta">
          <div class="mini-bar" data-mini="${subId}"></div>
          <span data-count="${subId}"></span>
          <span class="chevron">▾</span>
        </div>`;
      header.addEventListener('click', () => {
        box.classList.toggle('collapsed');
      });
      box.appendChild(header);

      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr><th style="width:110px;">Ticket</th><th>Summary</th><th class="status">Resolution</th></tr>
        </thead>
        <tbody>
          ${sub.items.map(([id, summary]) => {
            const current = state[id] || 'not-started';
            return `<tr data-row="${id}">
              <td class="ticket">${id}</td>
              <td class="summary">${summary}</td>
              <td class="status">${statusBadgeHTML(id, current)}</td>
            </tr>`;
          }).join('')}
        </tbody>`;
      box.appendChild(table);

      section.appendChild(box);
    });

    root.appendChild(section);
  });

  root.querySelectorAll('select.status-select').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      const value = e.target.value;
      state[id] = value;
      saveState(state);
      const badge = e.target.closest('.status-badge');
      badge.className = `status-badge ${value}`;
      updateSummary();
    });
  });

  updateSummary();
}

function allIds(){
  const ids = [];
  DATA.forEach(cat => cat.subsections.forEach(sub => sub.items.forEach(([id]) => ids.push(id))));
  return ids;
}

function updateSummary(){
  const ids = allIds();
  let notStarted=0, inProgress=0, done=0;
  ids.forEach(id => {
    const s = state[id] || 'not-started';
    if(s === 'done') done++;
    else if(s === 'in-progress') inProgress++;
    else notStarted++;
  });
  const total = ids.length;
  document.getElementById('count-not-started').textContent = notStarted;
  document.getElementById('count-in-progress').textContent = inProgress;
  document.getElementById('count-done').textContent = done;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('count-pct').textContent = pct + '%';

  const bar = document.getElementById('overall-bar');
  bar.innerHTML = `
    <div class="bar-seg done" style="width:${(done/total)*100}%"></div>
    <div class="bar-seg progress" style="width:${(inProgress/total)*100}%"></div>
  `;

  DATA.forEach((cat, ci) => {
    cat.subsections.forEach((sub, si) => {
      const subId = `cat-${ci}-sub-${si}`;
      let sDone=0, sProg=0, sTotal=sub.items.length;
      sub.items.forEach(([id]) => {
        const s = state[id] || 'not-started';
        if(s==='done') sDone++;
        else if(s==='in-progress') sProg++;
      });
      const mini = document.querySelector(`[data-mini="${subId}"]`);
      if(mini){
        mini.innerHTML = `
          <div class="bar-seg done" style="width:${(sDone/sTotal)*100}%"></div>
          <div class="bar-seg progress" style="width:${(sProg/sTotal)*100}%"></div>`;
      }
      const count = document.querySelector(`[data-count="${subId}"]`);
      if(count) count.textContent = `${sDone}/${sTotal}`;
    });
  });
}

buildContent();
</script>
</body>
</html>
